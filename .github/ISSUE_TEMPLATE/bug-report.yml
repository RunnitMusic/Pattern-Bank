name: Bug report
description: Report a reproducible Pattern Bank problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: platform
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: flstudio
    attributes:
      label: FL Studio version and build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
